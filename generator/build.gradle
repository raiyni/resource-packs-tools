plugins {
    id 'io.ryoung.java-downloader'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def baseRepoUrl = 'https://raw.githubusercontent.com/melkypie/resource-packs/refs/heads/master'

javaDownload {
    files = [
            [url : "${baseRepoUrl}/src/main/java/melky/resourcepacks/model/runelite/ChatColorKey.java",
             path: 'src/main/java/melky/resourcepacks/model/runelite/ChatColorKey.java'],
            [url : "${baseRepoUrl}/src/main/resources/overrides/overrides.toml",
             path: 'src/main/resources/overrides/overrides.toml'],
            [url : "${baseRepoUrl}/src/main/resources/overrides/vars.toml",
             path: 'src/main/resources/overrides/vars.toml']
    ]
}

dependencies {
    implementation project(':common')
    compileOnly group: 'net.runelite', name: 'runelite-api', version: runeLiteVersion
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'com.google.guava:guava:23.2-jre'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

jar {
    manifest {
        attributes  'Main-Class': 'melky.resourcepacks.generator.PackBuilder'
    }
}

tasks.register('generateSamples', JavaExec) {
	mainClass = 'melky.resourcepacks.generator.OverridesBuilder'
	classpath = sourceSets.main.runtimeClasspath
	systemProperty('outputDir', System.getProperty('outputDir', 'out/sample-vanilla'))
	systemProperty('overridesPath', System.getProperty('overridesPath'))
}

tasks.register('generatePack', JavaExec) {
	mainClass = 'melky.resourcepacks.generator.SpriteSyncer'
	classpath = sourceSets.main.runtimeClasspath
	systemProperty('spriteFolder', System.getProperty('spriteFolder'))
	systemProperty('outputDir', System.getProperty('outputDir', 'sample-pack'))
}

tasks.register('buildPack', JavaExec) {
	mainClass = 'melky.resourcepacks.generator.PackBuilder'
	classpath = sourceSets.main.runtimeClasspath
	systemProperty('spriteFolder', System.getProperty('spriteFolder'))
	systemProperty('outputDir', System.getProperty('outputDir', 'sample-pack'))
	systemProperty('overridesPath', System.getProperty('overridesPath'))
}
