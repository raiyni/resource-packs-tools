name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Release version in x.y.z format
        required: true
        type: string
      dryRun:
        description: Build and show the planned tag without committing or pushing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release task
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          chmod +x ./gradlew
          if [ "$DRY_RUN" = "true" ]; then
            ./gradlew release "-PreleaseVersion=$RELEASE_VERSION" -PdryRun
          else
            ./gradlew release "-PreleaseVersion=$RELEASE_VERSION"
          fi
