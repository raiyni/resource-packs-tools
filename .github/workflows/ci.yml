name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build shadowJar

      - name: Upload generator JAR
        uses: actions/upload-artifact@v4
        with:
          name: generator-fat-jar
          path: generator/build/libs/generator-v*.jar

      - name: Upload validation JAR
        uses: actions/upload-artifact@v4
        with:
          name: validation-fat-jar
          path: validation/build/libs/validation-v*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generator JAR
        uses: actions/download-artifact@v4
        with:
          name: generator-fat-jar
          path: ./artifacts/

      - name: Download validation JAR
        uses: actions/download-artifact@v4
        with:
          name: validation-fat-jar
          path: ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./artifacts/generator-v*.jar
            ./artifacts/validation-v*.jar
