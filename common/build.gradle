plugins {
    id 'io.ryoung.java-downloader'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def resourcePacksRef = findProperty('resourcePacksRef') ?: 'refs/heads/master'
def baseRepoUrl = "https://raw.githubusercontent.com/melkypie/resource-packs/${resourcePacksRef}"

javaDownload {
    files = [
            [url : "${baseRepoUrl}/src/main/java/melky/resourcepacks/model/SpriteOverride.java",
             path: 'src/main/java/melky/resourcepacks/model/SpriteOverride.java']
    ]
}

dependencies {
    compileOnly libs.runelite.api
    implementation libs.guava
    implementation libs.slf4j.api
    runtimeOnly libs.slf4j.simple
    compileOnly libs.lombok
    annotationProcessor libs.lombok
}
